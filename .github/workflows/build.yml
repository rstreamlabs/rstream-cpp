name: Build
on:
  push:
    branches:
      - codex/**
      - develop
      - main
      - feature-**
      - fix-**
  workflow_dispatch:
    inputs:
      channel:
        description: Conan package channel.
        required: true
        type: choice
        default: testing
        options:
          - dev
          - stable
          - testing
permissions:
  contents: read
jobs:
  release-workflow:
    name: Release workflow
    if: ${{ github.actor == vars.CI_ALLOWED_ACTOR }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 test/test_release_workflow.py
  build:
    name: Conan package
    if: ${{ github.actor == vars.CI_ALLOWED_ACTOR }}
    uses: ./.github/workflows/conan.yml
    with:
      channel: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || (github.ref_name == 'main' && 'stable' || 'dev') }}
