name: Build Dev
on:
  push:
    branches:
      - feature-**
      - fix-**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: ${{ github.actor == vars.CI_ALLOWED_ACTOR }}
    strategy:
      fail-fast: false
      matrix:
        build:
          - {
              conan:
                {
                  channel: "dev",
                  profiles: { build: "default", host: "default" },
                },
            }
    uses: ./.github/workflows/conan.yml
    secrets: inherit
    with:
      build: ${{ toJson(matrix.build) }}
