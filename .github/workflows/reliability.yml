name: Reliability
on:
  schedule:
    - cron: "19 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    name: Complete package matrix
    if: ${{ github.actor == vars.CI_ALLOWED_ACTOR }}
    uses: ./.github/workflows/conan.yml
    with:
      channel: dev
  sanitizers:
    name: ${{ matrix.name }}
    if: ${{ github.actor == vars.CI_ALLOWED_ACTOR }}
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Thread sanitizer
            preset: tsan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: brew install boost libmaxminddb ninja nlohmann-json openssl@3 protobuf spdlog yaml-cpp
      - name: Configure
        run: cmake --preset "${{ matrix.preset }}"
      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}"
      - name: Test
        run: ctest --preset "${{ matrix.preset }}"
  memory-checks:
    name: ${{ matrix.name }}
    if: ${{ github.actor == vars.CI_ALLOWED_ACTOR }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux address, undefined behavior and leak checks
            runner: ubuntu-24.04
            cache: conan-linux-asan-v1
            test_step: Check runtime with instrumented dependencies
            options: ""
          - name: Address and undefined behavior sanitizers
            runner: macos-latest
            cache: conan-macos-asan-v1
            test_step: Test
            options: --shared --dynamic-plugins
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config
      - name: Install macOS build prerequisites
        if: runner.os == 'macOS'
        run: brew install cmake coreutils ninja pkg-config
      - name: Configure Conan
        run: |
          python3 -m pip install conan==2.31.2
          conan profile detect --force
          conan config install conan/config
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: memory-cache
        with:
          path: ~/.conan2/p
          key: ${{ matrix.cache }}-${{ runner.arch }}-${{ hashFiles('conanfile.py', 'conan/config/**', '.github/scripts/test-memory-sanitizers.py') }}
          restore-keys: ${{ matrix.cache }}-${{ runner.arch }}-
      - name: ${{ matrix.test_step }}
        run: python3 .github/scripts/test-memory-sanitizers.py --output out/memory-sanitizers --jobs 3 ${{ matrix.options }}
      - name: Preserve memory check evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: memory-sanitizers-${{ runner.os }}-${{ github.sha }}
          path: |
            out/memory-sanitizers/dependencies.json
            out/memory-sanitizers/results.junit.xml
          if-no-files-found: error
          retention-days: 90
      - name: Trim dependency build caches
        if: ${{ always() && !cancelled() }}
        run: conan cache clean "*" --source --build --download --temp
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ always() && !cancelled() && steps.memory-cache.outputs.cache-hit != 'true' }}
        with:
          path: ~/.conan2/p
          key: ${{ steps.memory-cache.outputs.cache-primary-key }}
  static-analysis:
    name: Static analysis
    if: ${{ github.actor == vars.CI_ALLOWED_ACTOR }}
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: brew install boost libmaxminddb llvm ninja nlohmann-json openssl@3 protobuf spdlog yaml-cpp
      - name: Configure
        run: cmake --preset quality
      - name: Build
        run: cmake --build --preset quality
      - name: Analyze product sources
        run: |
          set -euo pipefail
          sdkroot=$(xcrun --show-sdk-path)
          "$(brew --prefix llvm)/bin/run-clang-tidy" \
            -clang-tidy-binary "$(brew --prefix llvm)/bin/clang-tidy" \
            -p out/build/quality \
            -j "$(sysctl -n hw.logicalcpu)" \
            -quiet \
            -hide-progress \
            -warnings-as-errors="*" \
            -extra-arg=-isysroot \
            -extra-arg="${sdkroot}" \
            '^.*/rstream-cpp/(lib|bin|plugin)/.*\.cpp$'
  stress:
    name: Deterministic stress tests
    if: ${{ github.actor == vars.CI_ALLOWED_ACTOR }}
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: brew install boost libmaxminddb ninja nlohmann-json openssl@3 protobuf spdlog yaml-cpp
      - name: Configure
        run: cmake --preset quality
      - name: Build
        run: cmake --build --preset quality
      - name: Repeat concurrency and lifecycle tests
        run: |
          ctest \
            --test-dir out/build/quality \
            --repeat until-fail:20 \
            --output-on-failure \
            -R 'core-(executor-binder|plugin-version)|io-common-(payloader-limits|queue|stream-tcp)|io-rstrm-(control-channel|handshake)|nperf-runtime|tunnel-proxy|webtty-.*runtime'
