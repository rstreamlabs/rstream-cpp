name: Build Conan package
on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
permissions:
  contents: read
env:
  CONAN_VERSION: "2.26.2"
jobs:
  build:
    name: Conan create
    if: ${{ github.actor == vars.CI_ALLOWED_ACTOR }}
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        shell: bash
        run: |
          sudo apt update && sudo apt-get install -y \
            build-essential \
            ccache \
            cmake \
            file \
            git \
            gzip \
            jq \
            ninja-build \
            pipx \
            pkg-config \
            tar \
            xz-utils
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.x"
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        id: conan-cache
        with:
          path: ~/.conan2/p
          key: conan2-${{ env.CONAN_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.channel }}-${{ hashFiles('conanfile.py', 'conan/config/**', 'CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            conan2-${{ env.CONAN_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.channel }}-
      - name: Install Conan
        shell: bash
        run: |
          pipx install "conan==${CONAN_VERSION}"
          echo "${HOME}/.local/bin" >> $GITHUB_PATH
      - name: Configure Conan
        shell: bash
        run: |
          conan profile detect -f
          conan config install conan/config
      - name: Build Conan package
        shell: bash
        run: |
          conan create --build=missing --user conan --channel "${{ inputs.channel }}" -pr:b default -pr:h default .
      - name: Trim Conan cache
        if: ${{ success() }}
        shell: bash
        run: |
          conan cache clean "*" --source --build --download --temp
      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        if: ${{ success() && steps.conan-cache.outputs.cache-hit != 'true' }}
        with:
          path: ~/.conan2/p
          key: ${{ steps.conan-cache.outputs.cache-primary-key }}
