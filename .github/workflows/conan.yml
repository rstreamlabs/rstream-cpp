name: Build Conan package
on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
permissions:
  contents: read
env:
  CONAN_VERSION: "2.26.2"
  CONAN_REMOTE_NAME: "${{ vars.CONAN_REMOTE_NAME }}"
  CONAN_REMOTE_URL: "${{ vars.CONAN_REMOTE_URL }}"
  PATCHED_BOOST_VERSION: "1.85.0"
  PATCHED_CONAN_CHANNEL: conan/stable
  PATCHED_NCURSES_VERSION: "6.5"
  USE_PATCHED_CONAN_DEPS: "on"
jobs:
  build:
    name: Conan create
    if: ${{ github.actor == vars.CI_ALLOWED_ACTOR }}
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        shell: bash
        run: |
          sudo apt update && sudo apt-get install -y \
            build-essential \
            ccache \
            cmake \
            file \
            git \
            gzip \
            jq \
            ninja-build \
            pipx \
            pkg-config \
            tar \
            xz-utils
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.x"
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        id: conan-cache
        with:
          path: ~/.conan2/p
          key: conan2-${{ env.CONAN_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.channel }}-${{ hashFiles('conanfile.py', 'conan/config/**', 'CMakeLists.txt', 'cmake/**', '.github/workflows/conan.yml') }}
          restore-keys: |
            conan2-${{ env.CONAN_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.channel }}-
      - name: Install Conan
        shell: bash
        run: |
          pipx install "conan==${CONAN_VERSION}"
          echo "${HOME}/.local/bin" >> $GITHUB_PATH
      - name: Configure Conan
        shell: bash
        run: |
          set -euo pipefail
          conan profile detect -f
          conan config install conan/config
          if [[ -n "${CONAN_REMOTE_URL}" ]]; then
            remote_name="${CONAN_REMOTE_NAME:-rstream}"
            conan remote list | grep -q "^${remote_name}:" && conan remote update "${remote_name}" --url "${CONAN_REMOTE_URL}" || conan remote add "${remote_name}" "${CONAN_REMOTE_URL}"
          fi
      - name: Build Conan package
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "${USE_PATCHED_CONAN_DEPS}" == "on" ]]; then
            args+=("-o" "rstream/*:boost_ref=boost/${PATCHED_BOOST_VERSION}@${PATCHED_CONAN_CHANNEL}")
            args+=("-o" "rstream/*:ncurses_ref=ncurses/${PATCHED_NCURSES_VERSION}@${PATCHED_CONAN_CHANNEL}")
          fi
          conan create --build=missing --user conan --channel "${{ inputs.channel }}" -pr:b default -pr:h default "${args[@]}" .
      - name: Trim Conan cache
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          conan cache clean "*" --source --build --download --temp
      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        if: ${{ success() && steps.conan-cache.outputs.cache-hit != 'true' }}
        with:
          path: ~/.conan2/p
          key: ${{ steps.conan-cache.outputs.cache-primary-key }}
