name: build, package and deploy
on:
  workflow_call:
    inputs:
      build:
        required: true
        type: string
    secrets:
      CONAN_PASSWORD:
        required: false
permissions:
  contents: read
env:
  CONAN_VERSION: "2.26.2"
  RSTREAM_URL: "${{ github.ref_type == 'tag' && 'https://rstream.io' || 'https://dev.rstream.io' }}"
  CONAN_REMOTE_NAME: "${{ vars.CONAN_REMOTE_NAME }}"
  CONAN_REMOTE_URL: "${{ vars.CONAN_REMOTE_URL }}"
  CONAN_REMOTE_USERNAME: "${{ vars.CONAN_REMOTE_USERNAME }}"
jobs:
  build:
    if: ${{ github.actor == vars.CI_ALLOWED_ACTOR }}
    strategy:
      fail-fast: true
      matrix:
        build:
          - ${{ fromJSON(inputs.build) }}
    runs-on: ["self-hosted", "Linux"]
    steps:
      - name: Install dependencies
        shell: bash
        run: |
          sudo apt update && sudo apt-get install -y \
            build-essential \
            ccache \
            cmake \
            file \
            git \
            gzip \
            jq \
            ninja-build \
            pipx \
            pkg-config \
            tar \
            xz-utils
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          cache: "pip"
      - name: install conan
        shell: bash
        run: |
          pipx install "conan==${CONAN_VERSION}"
          echo "/root/.local/bin/" >> $GITHUB_PATH
      - name: configure conan
        shell: bash
        run: |
          conan profile detect -f
          conan config install conan/config
          if [[ -n "${CONAN_REMOTE_URL}" ]]; then
            remote_name="${CONAN_REMOTE_NAME:-rstream}"
            conan remote list | grep -q "${remote_name}" || conan remote add -f "${remote_name}" "${CONAN_REMOTE_URL}"
          fi
      - name: build
        shell: bash
        run: |
          conan create --build=missing --user conan --channel ${{ matrix.build.conan.channel }} -pr:b ${{ matrix.build.conan.profiles.build }} -pr:h ${{ matrix.build.conan.profiles.host }} .
      - name: upload
        shell: bash
        env:
          CONAN_LOGIN_USERNAME: ${{ env.CONAN_REMOTE_USERNAME }}
          CONAN_PASSWORD: ${{ secrets.CONAN_PASSWORD }}
        run: |
          if [[ -z "${CONAN_REMOTE_URL}" || -z "${CONAN_LOGIN_USERNAME}" || -z "${CONAN_PASSWORD}" ]]; then
            echo "Conan upload skipped: remote credentials are not configured."
            exit 0
          fi
          remote_name="${CONAN_REMOTE_NAME:-rstream}"
          conan remote login "${remote_name}"
          conan upload "rstream/*@conan/${{ matrix.build.conan.channel }}" -r "${remote_name}" --confirm
