name: Release Packages
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload packages after a successful export.
        required: true
        type: boolean
        default: false
      channel:
        description: Package channel.
        required: true
        type: choice
        default: stable
        options:
          - stable
          - dev
      rstream_url:
        description: Package API base URL.
        required: true
        type: choice
        default: https://rstream.io
        options:
          - https://rstream.io
          - https://dev.rstream.io
      package_name:
        description: Exported package name.
        required: true
        type: string
        default: rstream-utils
  push:
    tags:
      - "*"
permissions:
  contents: read
concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: false
env:
  CHANNEL: "${{ inputs.channel || (github.ref_type == 'tag' && 'stable' || 'dev') }}"
  CONAN_VERSION: "2.26.2"
  CONAN_REMOTE_NAME: "${{ vars.CONAN_REMOTE_NAME }}"
  CONAN_REMOTE_URL: "${{ vars.CONAN_REMOTE_URL }}"
  CONAN_REMOTE_USERNAME: "${{ vars.CONAN_REMOTE_USERNAME }}"
  EXPORT_PACKAGE_NAME: "${{ inputs.package_name || 'rstream-utils' }}"
  RSTREAM_URL: "${{ inputs.rstream_url || (github.ref_type == 'tag' && 'https://rstream.io' || 'https://dev.rstream.io') }}"
  UPLOAD_PACKAGES: "${{ github.ref_type == 'tag' || inputs.upload == true }}"
  VERSION: "${{ github.ref_name }}"
jobs:
  package-linux-windows:
    if: ${{ github.actor == vars.CI_ALLOWED_ACTOR && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') }}
    name: Package ${{ matrix.target.os }} ${{ matrix.target.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target:
          - os: linux
            arch: x86_i686
          - os: linux
            arch: x86_core2
          - os: linux
            arch: x86_64
          - os: linux
            arch: x86_64_v2
          - os: linux
            arch: x86_64_v3
          - os: linux
            arch: x86_64_v4
          - os: linux
            arch: armv6
          - os: linux
            arch: armv6hf
          - os: linux
            arch: armv7
          - os: linux
            arch: armv7hf
          - os: linux
            arch: arm64
          - os: linux
            arch: mips
          - os: linux
            arch: mipsle
          - os: linux
            arch: mips64
          - os: linux
            arch: mips64le
          - os: linux
            arch: riscv64
          - os: windows
            arch: x86_i686
          - os: windows
            arch: x86_core2
          - os: windows
            arch: x86_64
          - os: windows
            arch: x86_64_v2
          - os: windows
            arch: x86_64_v3
          - os: windows
            arch: x86_64_v4
          - os: windows
            arch: arm64
    env:
      LINUX_BUILD_SHARED: "off"
      LINUX_ARCHS: ${{ matrix.target.os == 'linux' && matrix.target.arch || '' }}
      LINUX_TCLIBCS: musl
      LLVM_MINGW_VERSION: "20251118"
      OSS: ${{ matrix.target.os }}
      USE_DOCKER: "off"
      WINDOWS_BUILD_SHARED: "off"
      WINDOWS_ARCHS: ${{ matrix.target.os == 'windows' && matrix.target.arch || '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.x"
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        id: conan-cache
        with:
          path: |
            ~/.conan2/p
            ~/.cache/ccache
          key: conan2-release-${{ env.CONAN_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target.os }}-${{ matrix.target.arch }}-${{ env.CHANNEL }}-${{ hashFiles('conanfile.py', 'conan/config/**', 'CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            conan2-release-${{ env.CONAN_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target.os }}-
            conan2-release-${{ env.CONAN_VERSION }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Validate release tag
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${VERSION}" =~ ^v?[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release tag: ${VERSION}" >&2
            exit 1
          fi
          package_version="$(tr -d '[:space:]' < version.txt)"
          if [[ "${package_version}" != "${VERSION#v}" ]]; then
            echo "release tag ${VERSION#v} does not match version.txt ${package_version}" >&2
            exit 1
          fi
          echo "VERSION=${VERSION#v}" >> "${GITHUB_ENV}"
      - name: Resolve package version
        if: ${{ github.ref_type != 'tag' }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(tr -d '[:space:]' < version.txt)"
          if [[ ! "${package_version}" =~ ^[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid package version: ${package_version}" >&2
            exit 1
          fi
          echo "VERSION=${package_version}" >> "${GITHUB_ENV}"
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            ccache \
            cmake \
            curl \
            file \
            git \
            gzip \
            jq \
            libdigest-sha-perl \
            musl-dev \
            nasm \
            ninja-build \
            pipx \
            pkg-config \
            python3 \
            python3-dev \
            python3-pip \
            tar \
            xz-utils
          pipx install "conan==${CONAN_VERSION}"
          python3 -m pip install --user PyYAML
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/local/lib/android /usr/share/dotnet
          sudo docker system prune -af >/dev/null || true
      - name: Install llvm-mingw
        if: ${{ matrix.target.os == 'windows' }}
        shell: bash
        run: |
          set -euo pipefail
          host_arch="$(dpkg --print-architecture)"
          case "${host_arch}" in
            amd64) llvm_mingw_host_arch="x86_64" ;;
            arm64) llvm_mingw_host_arch="aarch64" ;;
            *) echo "unsupported host architecture for llvm-mingw: ${host_arch}" >&2; exit 1 ;;
          esac
          llvm_mingw_dir="/opt/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-${llvm_mingw_host_arch}"
          curl -fsSL "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-${llvm_mingw_host_arch}.tar.xz" | sudo tar -xJf - -C /opt
          sudo ln -sfn "${llvm_mingw_dir}" /opt/llvm-mingw
          echo "/opt/llvm-mingw/bin" >> "${GITHUB_PATH}"
      - name: Configure Conan
        shell: bash
        env:
          CONAN_PASSWORD: ${{ secrets.CONAN_PASSWORD }}
        run: |
          set -euo pipefail
          conan profile detect -f
          conan config install conan/config
          if [[ -n "${CONAN_REMOTE_URL}" ]]; then
            remote_name="${CONAN_REMOTE_NAME:-rstream}"
            conan remote list | grep -q "^${remote_name}:" && conan remote update "${remote_name}" --url "${CONAN_REMOTE_URL}" || conan remote add "${remote_name}" "${CONAN_REMOTE_URL}"
            if [[ -n "${CONAN_REMOTE_USERNAME}" && -n "${CONAN_PASSWORD}" ]]; then
              conan remote login "${remote_name}" "${CONAN_REMOTE_USERNAME}" -p "${CONAN_PASSWORD}"
            fi
          fi
      - name: Validate package version
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(conan inspect . --format=json | python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])')
          if [[ "${package_version}" != "${VERSION}" ]]; then
            echo "release tag ${VERSION} does not match Conan package version ${package_version}" >&2
            exit 1
          fi
      - name: Build and export packages
        shell: bash
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH
          ./build-conan-cross.sh
      - name: Trim Conan cache
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          conan cache clean "*" --source --build --download --temp
      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        if: ${{ success() && steps.conan-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.conan2/p
            ~/.cache/ccache
          key: ${{ steps.conan-cache.outputs.cache-primary-key }}
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.EXPORT_PACKAGE_NAME }}-${{ matrix.target.os }}-${{ matrix.target.arch }}-${{ env.CHANNEL }}
          path: out/release/**/${{ matrix.target.os }}/${{ matrix.target.arch }}/**/packages/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload packages
        if: ${{ env.UPLOAD_PACKAGES == 'true' }}
        shell: bash
        env:
          RSTREAM_TOKEN: ${{ secrets.RSTREAM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${RSTREAM_TOKEN}" ]]; then
            echo "RSTREAM_TOKEN is required when package upload is enabled."
            exit 1
          fi
          unset LD_LIBRARY_PATH
          ./build-conan-cross.sh upload
  package-macos:
    if: ${{ github.actor == vars.CI_ALLOWED_ACTOR && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') }}
    name: Package macos
    runs-on: macos-latest
    env:
      MACOS_APP_STORE_API_KEY: ${{ secrets.MACOS_APP_STORE_API_KEY }}
      MACOS_BUILD_SHARED: "on"
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      MACOS_CODESIGN_MODE: "${{ (github.ref_type == 'tag' || inputs.upload == true) && 'certificate' || '' }}"
      MACOS_CODESIGN_TOOL: rcodesign
      OSS: macos
      USE_DOCKER: "off"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.x"
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        id: conan-cache
        with:
          path: ~/.conan2/p
          key: conan2-${{ env.CONAN_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ env.CHANNEL }}-${{ hashFiles('conanfile.py', 'conan/config/**', 'CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            conan2-${{ env.CONAN_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ env.CHANNEL }}-
            conan2-${{ env.CONAN_VERSION }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Validate release tag
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${VERSION}" =~ ^v?[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release tag: ${VERSION}" >&2
            exit 1
          fi
          package_version="$(tr -d '[:space:]' < version.txt)"
          if [[ "${package_version}" != "${VERSION#v}" ]]; then
            echo "release tag ${VERSION#v} does not match version.txt ${package_version}" >&2
            exit 1
          fi
          echo "VERSION=${VERSION#v}" >> "${GITHUB_ENV}"
      - name: Resolve package version
        if: ${{ github.ref_type != 'tag' }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(tr -d '[:space:]' < version.txt)"
          if [[ ! "${package_version}" =~ ^[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid package version: ${package_version}" >&2
            exit 1
          fi
          echo "VERSION=${package_version}" >> "${GITHUB_ENV}"
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew list bash >/dev/null 2>&1 || brew install bash
          brew list jq >/dev/null 2>&1 || brew install jq
          echo "$(brew --prefix bash)/bin" >> "${GITHUB_PATH}"
          python3 -m pip install --user "conan==${CONAN_VERSION}"
          python3 -m pip install --user PyYAML
          echo "$(python3 -m site --user-base)/bin" >> "${GITHUB_PATH}"
      - name: Install apple-codesign
        if: ${{ env.MACOS_CODESIGN_MODE != '' }}
        shell: bash
        env:
          APPLE_CODESIGN_SHA256_MACOS_UNIVERSAL: d98372d5524226ccf9dc0eda03d4e4f5826182dabb2fc3f2bd303ed9113a748d
          APPLE_CODESIGN_VERSION: "0.29.0"
        run: |
          set -euo pipefail
          if command -v rcodesign >/dev/null 2>&1 && [[ "$(rcodesign --version | grep -o '[0-9.]*')" == "${APPLE_CODESIGN_VERSION}" ]]; then
            exit 0
          fi
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          archive="apple-codesign-${APPLE_CODESIGN_VERSION}-macos-universal.tar.gz"
          curl -fsSL -o "${tmp_dir}/${archive}" "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${APPLE_CODESIGN_VERSION}/${archive}"
          echo "${APPLE_CODESIGN_SHA256_MACOS_UNIVERSAL}  ${tmp_dir}/${archive}" | shasum -a 256 -c -
          tar -xzf "${tmp_dir}/${archive}" -C "${tmp_dir}"
          sudo install -m 0755 "${tmp_dir}/apple-codesign-${APPLE_CODESIGN_VERSION}-macos-universal/rcodesign" /usr/local/bin/rcodesign
      - name: Configure Conan
        shell: bash
        run: |
          set -euo pipefail
          conan profile detect -f
          conan config install conan/config
      - name: Validate package version
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(conan inspect . --format=json | python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])')
          if [[ "${package_version}" != "${VERSION}" ]]; then
            echo "release tag ${VERSION} does not match Conan package version ${package_version}" >&2
            exit 1
          fi
      - name: Build and export packages
        shell: bash
        run: |
          set -euo pipefail
          ./build-conan-cross.sh
      - name: Trim Conan cache
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          conan cache clean "*" --source --build --download --temp
      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        if: ${{ success() && steps.conan-cache.outputs.cache-hit != 'true' }}
        with:
          path: ~/.conan2/p
          key: ${{ steps.conan-cache.outputs.cache-primary-key }}
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.EXPORT_PACKAGE_NAME }}-macos-${{ env.CHANNEL }}
          path: out/release/**/macos/**/packages/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload packages
        if: ${{ env.UPLOAD_PACKAGES == 'true' }}
        shell: bash
        env:
          RSTREAM_TOKEN: ${{ secrets.RSTREAM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${RSTREAM_TOKEN}" ]]; then
            echo "RSTREAM_TOKEN is required when package upload is enabled."
            exit 1
          fi
          ./build-conan-cross.sh upload
  publish-conan-source:
    if: ${{ github.actor == vars.CI_ALLOWED_ACTOR && github.ref_type == 'tag' }}
    name: Publish Conan source package
    needs:
      - package-linux-windows
      - package-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.x"
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        id: conan-cache
        with:
          path: ~/.conan2/p
          key: conan2-${{ env.CONAN_VERSION }}-${{ runner.os }}-${{ runner.arch }}-stable-${{ hashFiles('conanfile.py', 'conan/config/**', 'CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            conan2-${{ env.CONAN_VERSION }}-${{ runner.os }}-${{ runner.arch }}-stable-
            conan2-${{ env.CONAN_VERSION }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${VERSION}" =~ ^v?[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release tag: ${VERSION}" >&2
            exit 1
          fi
          package_version="$(tr -d '[:space:]' < version.txt)"
          if [[ "${package_version}" != "${VERSION#v}" ]]; then
            echo "release tag ${VERSION#v} does not match version.txt ${package_version}" >&2
            exit 1
          fi
          echo "VERSION=${VERSION#v}" >> "${GITHUB_ENV}"
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt-get install -y \
            build-essential \
            ccache \
            cmake \
            file \
            git \
            gzip \
            jq \
            ninja-build \
            pipx \
            pkg-config \
            tar \
            xz-utils
          pipx install "conan==${CONAN_VERSION}"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Configure Conan
        shell: bash
        run: |
          set -euo pipefail
          conan profile detect -f
          conan config install conan/config
          if [[ -n "${CONAN_REMOTE_URL}" ]]; then
            remote_name="${CONAN_REMOTE_NAME:-rstream}"
            conan remote list | grep -q "^${remote_name}:" && conan remote update "${remote_name}" --url "${CONAN_REMOTE_URL}" || conan remote add "${remote_name}" "${CONAN_REMOTE_URL}"
          fi
      - name: Validate package version
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(conan inspect . --format=json | python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])')
          if [[ "${package_version}" != "${VERSION}" ]]; then
            echo "release tag ${VERSION} does not match Conan package version ${package_version}" >&2
            exit 1
          fi
      - name: Validate Conan package from source
        shell: bash
        run: |
          set -euo pipefail
          conan create --build=missing -pr:b default -pr:h default .
      - name: Trim Conan cache
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          conan cache clean "*" --source --build --download --temp
      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        if: ${{ success() && steps.conan-cache.outputs.cache-hit != 'true' }}
        with:
          path: ~/.conan2/p
          key: ${{ steps.conan-cache.outputs.cache-primary-key }}
      - name: Upload Conan source package
        shell: bash
        env:
          CONAN_LOGIN_USERNAME: ${{ env.CONAN_REMOTE_USERNAME }}
          CONAN_PASSWORD: ${{ secrets.CONAN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${CONAN_REMOTE_URL}" || -z "${CONAN_LOGIN_USERNAME}" || -z "${CONAN_PASSWORD}" ]]; then
            echo "CONAN_REMOTE_URL, CONAN_REMOTE_USERNAME and CONAN_PASSWORD are required on release tags."
            exit 1
          fi
          remote_name="${CONAN_REMOTE_NAME:-rstream}"
          conan remote login "${remote_name}" "${CONAN_LOGIN_USERNAME}" -p "${CONAN_PASSWORD}"
          conan upload "rstream/${VERSION}" --only-recipe -r "${remote_name}" --check --confirm
