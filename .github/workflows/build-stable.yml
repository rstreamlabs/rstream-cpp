name: Build Stable
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    if: ${{ github.actor == vars.CI_ALLOWED_ACTOR }}
    strategy:
      fail-fast: false
      matrix:
        build:
          - {
              conan:
                {
                  channel: "stable",
                  profiles: { build: "default", host: "default" },
                },
            }
    uses: ./.github/workflows/conan.yml
    secrets:
      CONAN_PASSWORD: ${{ secrets.CONAN_PASSWORD }}
    with:
      build: ${{ toJson(matrix.build) }}
