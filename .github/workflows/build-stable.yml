name: Build Stable
on:
  push:
    branches:
      - main
    tags:
      - "*"
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build:
          - {
              conan:
                {
                  channel: "stable",
                  profiles: { build: "default", host: "default" },
                },
            }
    uses: ./.github/workflows/conan.yml
    secrets: inherit
    with:
      build: ${{ toJson(matrix.build) }}
